name = "tempmail"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Environment variables (non-secret configuration).
# Override per-environment below. Nothing here is a secret.
# ---------------------------------------------------------------------------
[env.production.vars]
EMAIL_DOMAIN = "submail.bond"
APP_URL = "https://submail.bond"
MAILBOX_TTL_HOURS = "24"
MAX_MESSAGE_SIZE = "10485760"        # 10 MiB total parsed message size
MAX_ATTACHMENT_SIZE = "5242880"      # 5 MiB per attachment
MAX_ATTACHMENTS_PER_MESSAGE = "10"
MAX_MESSAGES_PER_MAILBOX = "200"
CLEANUP_BATCH_SIZE = "50"

# Backblaze B2 attachment storage (non-secret parts; B2_KEY_ID and
# B2_APPLICATION_KEY are secrets set via `wrangler secret put`).
B2_REGION = "eu-central-003"
B2_BUCKET = "tempmail-attachments"

# ---------------------------------------------------------------------------
# D1 database binding.
# Create with: npx wrangler d1 create tempmail-db
# Paste the returned database_id below.
# ---------------------------------------------------------------------------
[[env.production.d1_databases]]
binding = "DB"
database_name = "tempmail-db"
database_id = "e8708351-7e90-45db-ad39-a4ba5394c247"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Backblaze B2 attachment storage.
# Create a private bucket and a dedicated app key in the Backblaze console:
#   1. Buckets → Create Bucket (Private).
#   2. Application Keys → Add a New Application Key — restrict it to that
#      bucket, with capabilities: readFiles, writeFiles, deleteFiles
#      (deleteFiles + writeFiles are both needed for Delete Objects).
#      Note: the master account key does NOT work with the S3-Compatible API.
# Then set these as Worker secrets/vars (NOT here — they are credentials):
#   npx wrangler secret put B2_KEY_ID           # the app key's keyID
#   npx wrangler secret put B2_APPLICATION_KEY  # the app key itself
# B2_REGION/B2_BUCKET are non-secret and belong in [vars] below
# (B2_REGION example: "us-east-005" — shown in the bucket's Endpoint).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Static frontend assets (public/index.html, app.js, styles.css). Served
# directly by Cloudflare's edge for matching paths without invoking the
# Worker; any request that doesn't match a static file (i.e. everything
# under /api/*) falls through to the fetch handler in src/index.ts. This is
# what "the frontend and API should run through Cloudflare Workers" means in
# practice — one deployable Worker, no separate hosting provider.
# ---------------------------------------------------------------------------
[env.production.assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Cron trigger for expired-mailbox cleanup. Runs hourly at minute 0.
# ---------------------------------------------------------------------------
[env.production.triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------------------
# Email Routing: incoming mail for the configured catch-all is delivered to
# this Worker's `email()` handler (see src/index.ts). This is intentionally
# receive-only — this service is not a mail sender/relay (see README's
# "No open relay" note), so no send_email binding is declared here. The
# routing rule itself is configured via the Cloudflare dashboard or
# `wrangler email` commands, since Email Routing DNS/catch-all setup is an
# account/zone-level action, not a wrangler.toml declaration. See README.md
# "Email Routing setup" for exact steps.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Example named environments. Duplicate/adjust as needed.
# Usage: npx wrangler deploy --env staging
# ---------------------------------------------------------------------------
[env.staging.vars]
EMAIL_DOMAIN = "staging.example.com"
APP_URL = "https://staging-app.example.com"
MAILBOX_TTL_HOURS = "48"
MAX_MESSAGE_SIZE = "10485760"
MAX_ATTACHMENT_SIZE = "5242880"
MAX_ATTACHMENTS_PER_MESSAGE = "10"
MAX_MESSAGES_PER_MAILBOX = "200"
CLEANUP_BATCH_SIZE = "50"
B2_REGION = "us-east-005"
B2_BUCKET = "tempmail-attachments-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "tempmail-db-staging"
database_id = "REPLACE_WITH_YOUR_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

# Staging uses its own B2 bucket + dedicated staging app key (secret).
